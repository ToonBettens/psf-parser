[project]
name = "psf-parser"
version = "0.2.1"
description = "A pure-python parser for Cadence's PSF format."
authors = [
    {name = "ToonBettens",email = "toon.bettens@outlook.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [ "parser", "parsing", "cadence", "spectre", "psf", "psfbin", "psfascii" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
repository = "https://github.com/ToonBettens/psf-parser"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psf_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib"
]

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
line-length = 160  # ruff format will break lines longer than 160 chars
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "PLE", "PLC", "PLW"]
ignore = [
    "E501",     # line length is an authoring decision, not a lint failure
    "PLC0415",  # deliberate local imports in PsfParser.__new__ to break a cycle
]

[tool.ruff.lint.isort]
known-first-party = ["psf_parser"]
